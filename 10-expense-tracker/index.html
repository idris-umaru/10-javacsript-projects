<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="app-header">
        <h1>💰 Expense Tracker</h1>
        <p class="subtitle">Track your expenses easily</p>
      </div>
    </div>

    <div class="balance-card">
      <div class="balance-info">
        <span class="balance-label">Total Expenses</span>
        <span class="balance-amount" id="total-expense">$0.00</span>
      </div>
    </div>

    <div class="expense-info">
      <h2>Add New Expense</h2>
      <div class="form-group">
        <input
          type="text"
          id="expense-name"
          placeholder="Expense name (e.g., Groceries)"
          required
        />
      </div>

      <div class="form-group">
        <input
          type="number"
          id="expense-amount"
          placeholder="Amount (e.g., 50.00)"
          step="0.05"
          min="0"
          required
        />
      </div>
      <div>
        <button id="add-expense-btn" class="btn btn-primary">
          Add Expense
        </button>
        <span>Add Expense</span>
      </div>

      <div class="expense-section">
        <div class="section-header">
          <h2>Expense List</h2>
          <button id="clear-all-btn" class="btn btn-secondary">
            Clear All
          </button>
        </div>
      </div>
      <div class="expense-list" id="expense-list">
        <p class="empty-message">
          No expenses yet. Add your first expense above!
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
