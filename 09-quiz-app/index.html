<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <meta
      name="description"
      content="A simple quiz application built with JavaScript."
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Start Screen -->
      <div class="start-screen" id="start-screen">
        <h1>Welcome to the Quiz App!</h1>
        <p>Test your knowledge with our quiz app</p>

        <div class="start-content">
          <p class="instructions">
            Answer all questions and see your score at the end.
          </p>
          <button id="start-btn" class="btn primary-btn">Start Quiz</button>
        </div>
      </div>

      <!-- Quiz Screen -->
      <div class="quiz-screen hidden" id="quiz-screen">
        <div class="quiz-header">
          <div class="progress-bar">
            <div class="progress" id="progress"></div>
          </div>

          <div class="quiz-info">
            <span class="question-counter">
              Question <span id="current-question">1</span> of
              <span id="total-questions">10</span>
            </span>
            <span class="score"> Score: <span id="score">0</span> </span>
          </div>
        </div>

        <div class="quiz-content">
          <h2 class="question" id="question">Question will appear here</h2>
          <div class="options" id="options">
            <!-- Options generated by JS -->
          </div>
        </div>

        <div class="quiz-footer">
          <button id="next-btn" class="btn primary-btn hidden">
            Next Question
          </button>
        </div>
      </div>

      <!-- Result Screen -->
      <div class="result-screen hidden" id="result-screen">
        <div class="result-content">
          <h1>Quiz Completed! 🎉</h1>

          <div class="result-stats">
            <div class="stat-item">
              <span class="stat-label">Your Score</span>
              <span class="stat-value" id="final-score">0</span>
            </div>

            <div class="stat-item">
              <span class="stat-label">Total Questions</span>
              <span class="stat-value" id="final-total">10</span>
            </div>

            <div class="stat-item">
              <span class="stat-label">Percentage</span>
              <span class="stat-value" id="percentage">0%</span>
            </div>
          </div>

          <div class="result-message" id="result-message">
            <!-- Message generated by JS -->
          </div>

          <div class="result-buttons">
            <button id="restart-btn" class="btn primary-btn">
              Restart Quiz
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
